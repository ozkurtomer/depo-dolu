version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: nuget
    directory: /collector
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /app
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /bot
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /packages/depodolu
    schedule: { interval: monthly }
