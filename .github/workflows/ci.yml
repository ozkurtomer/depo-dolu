name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths-ignore: ['data/**', 'README.md', 'README.tr.md', 'docs/**', 'bot/README.md']
  pull_request:

jobs:
  collector:
    name: Toplayıcı (.NET)
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test collector/DepoDolu.sln --verbosity normal

  bot:
    name: Telegram botu (Cloudflare Worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bot testleri
        run: if [ -d bot/test ]; then node --test bot/test/*.test.js; else echo 'bot/ henüz yok'; fi

  app:
    name: Mobil uygulama (Ionic + Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: SEO sayfalarını üret (il/yakıt sayfaları, sitemap)
        run: node tools/prerender.mjs --dist dist/browser --data ../data
      - name: npm istemci paketi testleri
        run: node --test ../packages/depodolu/test/*.test.mjs
      - name: API örneklerini yerel veriyle dene
        run: |
          node ../examples/prices.mjs --file ../data/latest.json --city bursa --fuel motorin
          python ../examples/prices.py --file ../data/latest.json --city izmir --fuel benzin

  android:
    name: Android (test APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - name: Web kodunu derle ve Android projesine kopyala
        run: npm run cap:sync
      - name: Firebase yapılandırması (varsa)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json eklendi: bu APK'da bildirimler çalışır."
          else
            echo "GOOGLE_SERVICES_JSON sırrı yok: APK bildirimsiz derlenecek."
          fi
      - name: Debug APK derle
        working-directory: app/android
        run: bash ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: depo-dolu-android-debug
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  extension:
    name: Chrome extension (Manifest V3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The extension has no npm dependencies and loads directly from source.
      - run: npm test
      - run: npm run check
