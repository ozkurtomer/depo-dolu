name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['data/**']
  pull_request:

jobs:
  collector:
    name: Toplayıcı (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test collector/DepoDolu.sln --verbosity normal

  app:
    name: Mobil uygulama (Ionic + Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
