name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths-ignore: ['data/**', 'README.md', 'README.tr.md', 'docs/**', 'bot/README.md']
  pull_request:

jobs:
  collector:
    name: Toplayıcı (.NET)
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test collector/DepoDolu.sln --verbosity normal

  bot:
    name: Telegram botu (Cloudflare Worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bot testleri
        run: if [ -d bot/test ]; then node --test bot/test/*.test.js; else echo 'bot/ henüz yok'; fi

  app:
    name: Mobil uygulama (Ionic + Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: API örneklerini yerel veriyle dene
        run: |
          node ../examples/prices.mjs --file ../data/latest.json --city bursa --fuel motorin
          python ../examples/prices.py --file ../data/latest.json --city izmir --fuel benzin
