name: Veri sağlığı

# Saatte bir: toplayıcı çalışmayı bıraktıysa ya da fiyatlar haftalarca hiç değişmediyse
# "veri-sagligi" etiketli bir issue açar (GitHub mobil uygulaması bildirir) ve isteğe bağlı
# olarak Telegram'dan sana yazar. Düzelince issue'yu kendisi kapatır.
# Telegram için: Settings → Variables → TELEGRAM_ADMIN_CHAT_ID (kendi sohbet kimliğin).
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Toplayıcıyı ve veriyi kontrol et
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ vars.TELEGRAM_ADMIN_CHAT_ID }}
        run: node tools/health_check.mjs --data data
