name: Web demo

# Uygulamanın web sürümünü GitHub Pages'e yayınlar:
#   https://ozkurtomer.github.io/depo-dolu/
# Uygulama fiyatları her açılışta repodaki data/ klasöründen canlı okur.
# Statik il sayfaları (bursa/motorin/ gibi), tüm iller tablosu ve sitemap ise derleme
# anında üretilir; arama sonuçları ve paylaşım önizlemeleri güncel kalsın diye
# günde birkaç kez yeniden yayınlanır. (Toplayıcının GITHUB_TOKEN ile attığı
# commit'ler başka iş akışlarını tetiklemez, bu yüzden zamanlama gerekiyor.)
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  schedule:
    # Türkiye saatiyle 00:20, 06:20, 12:20, 18:20. Zamlar çoğunlukla gece yarısı gelir.
    - cron: '20 3,9,15,21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx ng build --base-href /depo-dolu/
      # Tek sayfalık uygulama: bilinmeyen adresler de uygulamayı açsın.
      # (İl sayfaları üretilmeden önce kopyalanır; 404 sayfası ana sayfa özetini taşımaz.)
      - run: cp dist/browser/index.html dist/browser/404.html
      # Her il/yakıt için paylaşım görseli: WhatsApp ve X önizlemesinde güncel fiyat görünür.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet 'pillow>=11,<13'
      - name: Paylaşım görselleri
        run: python tools/make_share_images.py --data ../data --out dist/browser/og
      - name: İl/yakıt sayfaları, tüm iller tablosu, harita ve sitemap
        env:
          # İsteğe bağlı çerezsiz ziyaret sayacı: Settings → Variables → GOATCOUNTER_CODE (ör. depodolu).
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
        run: node tools/prerender.mjs --dist dist/browser --data ../data --base https://ozkurtomer.github.io/depo-dolu/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
