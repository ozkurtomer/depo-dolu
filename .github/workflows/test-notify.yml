name: Test bildirimi gönder

# Gerçek bildirim zincirini dener (Firebase + Telegram kanalı + Telegram botu).
# Veriye dokunmaz; mesajlar "🧪 Test" etiketlidir.
# Bot: abone listesine bağlantı her zaman denenir; deneme mesajı SADECE chat_id verilirse o sohbete gider.
on:
  workflow_dispatch:
    inputs:
      city:
        description: 'İl anahtarı (ör. bursa, istanbul-avrupa, ankara)'
        required: true
        default: bursa
      fuel:
        description: 'Yakıt'
        type: choice
        options: [motorin, benzin, lpg]
        default: motorin
      telegram:
        description: 'Telegram kanalına da gönder (herkes görür)'
        type: boolean
        default: false
      chat_id:
        description: 'Bot denemesi: kendi Telegram sohbet kimliğin (boş bırakırsan sadece bağlantı denenir)'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test bildirimi gönder
        env:
          CITY: ${{ inputs.city }}
          FUEL: ${{ inputs.fuel }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CHAT: ${{ inputs.chat_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.telegram && vars.TELEGRAM_CHAT_ID || '' }}
          BOT_API_URL: ${{ vars.BOT_API_URL }}
          BOT_API_SECRET: ${{ secrets.BOT_API_SECRET }}
        run: >
          dotnet run --project collector/DepoDolu.Collector -c Release --
          --data data --test --city "$CITY" --fuel "$FUEL" --chat "$CHAT"
